[package]
name = "kagi"
version = "0.1.0"
authors = ["Jin Xue <csjinxue@outlook.com>"]
edition = "2018"

[profile.release]
debug = true

[[bin]]
name = "ycsb"
path = "bench/ycsb.rs"

[[bin]]
name = "kgdump"
path = "tools/kgdump.rs"

[features]
memdebug = []
hybrid_ts = []

[dependencies]
lru = "0.7"
crossbeam = "0.8.2"
lockfree = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
bincode = "1.2.0"
byteorder = "1.2"
fs2 = "0.4.3"
memmap = "0.7"
crc32fast = "1.2"
libc = "0.2"
futures = { version = "0.3", features = ["thread-pool"] }
integer-encoding = "1.1"
fasthash = "0.4"
ouroboros = "0.17.0"
tracing = "0.1"
bitflags = "2.3.3"

ycsb-rs = { git = "https://github.com/Jimx-/ycsb-rs.git" }
indicatif = "0.14"
tempfile = "3"
clap = { version = "3.2.5", features = ["derive"] }
tracing-subscriber = "0.2"
hdrhistogram = "7.1.0"

cfg-if = "0.1"